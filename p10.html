<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            color: white;
            padding: 20px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            padding: 50px;
            text-align: center;
            flex: 1;
        }

        footer {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            background-color: black;
            color: white;
            padding: 20px;
           align-items: center;
        }
    </style>

</head>
<body>

    <header>
        <h2>My Portfolio</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Welcome</h1>
        <p>I am a Web Developer.</p>
    </main>

    <footer>
        <p>Copyright 2026</p>
        <p>My Portfolio</p>
    </footer>

</body>
</html>
